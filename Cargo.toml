[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
color-eyre = "0.6"
futures = "0.3"
lexopt = "0.3.2"
pin-project-lite = "0.2"
postcard = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tokio-tungstenite = { version = "0.30", features = [
  "rustls-tls-native-roots",
  "url",
] }
tracing = "0.1"
tracing-loki = { version = "0.2", default-features = false, features = [
  "rustls",
  "compat-0-2-1",
] }
tracing-subscriber = "0.3"
url = "2.5"

# local dep
roasted-types = { path = "crates/types" }
