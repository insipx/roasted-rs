[package]
name = "roasted-data-streams"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-net = { version = "0.9", default-features = false, features = [
  "medium-ethernet",
  "proto-ipv4",
  "udp",
], optional = true }
embassy-time = { version = "0.5", optional = true }
embassy-time-driver = { version = "0.2", optional = true }
embedded-io-adapters = { workspace = true, features = [
  "tokio-1",
], optional = true }
embedded-io-async.workspace = true
futures-core.workspace = true
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
] }
mbedtls-rs-sys = { version = "0.3" }
pin-project-lite.workspace = true
postcard.workspace = true
rand_core = "0.10"
roasted-types = { workspace = true, default-features = false, features = [
  "zippy",
] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Use system headers instead of mbedtls-rs-sys's minimal Clang sysroot on Linux.
mbedtls-rs-sys = { version = "0.3", features = ["use-gcc"] }

[features]
default = ["std"]
std = [
  "embedded-io-adapters",
  "roasted-types/std",
  "tokio",
  "tokio/net",
  "tokio/time",
  "tracing/std",
]

embassy-net = [
  "dep:embassy-net",
  "dep:embassy-time",
  "dep:embassy-time-driver",
  "tracing/log",
]
