[package]
name = "roasted-types"
version = "0.1.0"
edition = "2024"

[dependencies]
bon = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "alloc"] }
serde_repr = { workspace = true, optional = true }
url = { workspace = true, default-features = false, features = [
  "serde",
], optional = true }
zeroize = { workspace = true, features = ["alloc"] }

# optional
diesel = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# local
roasted-db-schema = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
serde_json.workspace = true

[features]
std = []
default = ["all", "std", "serde/std", "zeroize/std", "url/std", "bon/std"]
all = ["db", "ws", "zippy", "daemon"]
db = ["dep:diesel", "dep:roasted-db-schema", "dep:uuid", "ws", "daemon"]
ws = ["dep:serde_repr"]
zippy = ["dep:bon", "dep:url"]
daemon = []
